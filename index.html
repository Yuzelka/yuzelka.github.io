<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yuzella Games</title>

    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid #444;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            color: #aaa;
        }

        main {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
        }

        .game {
            border: 1px solid #555;
            padding: 30px;
            margin-bottom: 30px;
        }

        .game h2 {
            margin-top: 0;
            font-size: 30px;
        }

        .game p {
            color: #bbb;
            line-height: 1.8;
        }

        .play-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;

            color: white;
            text-decoration: none;

            border: 1px solid white;

            transition: 0.2s;
        }

        .play-button:hover {
            background-color: white;
            color: black;
        }

        footer {
            text-align: center;
            color: #777;
            margin: 80px 0 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Yuzella Games</h1>
        <p>個人制作したゲームを公開しています。</p>
    </header>

    <main>

        <div class="game">
            <h2>盲</h2>

            <p>
                視覚を失った主人公が、感覚と周囲の情報を頼りに
                閉ざされた部屋からの脱出を目指すゲーム。
            </p>

            <a class="play-button" href="mou/">
                ゲームをプレイ
            </a>
        </div>

    </main>

    <footer>
        © Yuzella
    </footer>

</body>
</html>
