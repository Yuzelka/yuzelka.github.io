<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuzelka Games</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#f7f3ea;
    color:#333;
    font-family:"Yu Gothic",sans-serif;
}

.container{
    display:flex;
    min-height:100vh;
}

/* 左メニュー */
.sidebar{
    width:220px;
    background:#efe7d8;
    padding:40px 20px;
    border-right:1px solid #ddd;
    position:sticky;
    top:0;
    height:100vh;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:40px;
}

.menu a{
    display:block;
    color:#555;
    text-decoration:none;
    padding:12px 16px;
    margin-bottom:8px;
    border-radius:8px;
    transition:.2s;
}

.menu a:hover{
    background:white;
}

/* 右側 */
.content{
    flex:1;
    padding:60px;
}

header{
    margin-bottom:35px;
}

header h1{
    font-size:40px;
}

header p{
    color:#777;
    margin-top:10px;
}

.game-card{
    background:white;
    border-radius:16px;
    padding:28px;
    box-shadow:0 4px 16px rgba(0,0,0,.08);
}

.game-card img{
    width:100%;
    border-radius:10px;
    margin-bottom:25px;
}

.game-card h2{
    font-size:30px;
    margin-bottom:15px;
}

.game-card p{
    line-height:1.9;
    color:#666;
}

.play{
    display:inline-block;
    margin-top:25px;
    padding:12px 28px;
    background:#d8c8aa;
    color:#333;
    text-decoration:none;
    border-radius:8px;
}

.play:hover{
    background:#c8b48d;
}

footer{
    margin-top:50px;
    color:#777;
}

footer a{
    color:#666;
}
</style>
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <div class="logo">Yuzelka</div>

        <nav class="menu">
            <a href="/">🏠 ホーム</a>
            <a href="/mou/">🎮 盲</a>
        </nav>
    </aside>

    <main class="content">

        <header>
            <h1>Yuzelka Games</h1>
            <p>個人制作ゲームを公開しています。</p>
        </header>

        <section class="game-card">

            <img src="mou/title.png" alt="盲 タイトル画面">

            <h2>盲</h2>

            <p>
                視覚を失った主人公が、感覚と周囲の情報を頼りに
                閉ざされた部屋からの脱出を試みる。
            </p>

            <a class="play" href="/mou/">
                ゲームをプレイ
            </a>

        </section>

        <footer>
            X：
            <a href="https://x.com/yuzelka" target="_blank">@yuzelka</a>
            <br><br>
            感想やフォローをいただけると嬉しいです！
            <br><br>
            © Yuzelka
        </footer>

    </main>

</div>

</body>
</html>
